name: release

# Builds the public download from source. Pushing a tag such as v1.12.0 publishes it to that
# GitHub release; running it by hand only builds and keeps the files as a workflow artifact.
# Once SignPath is set up (secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID),
# NeonCue.exe is signed before it is zipped, after a person approves the request in SignPath.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/NeonCue/NeonCue.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match project version $version" }

      - name: Build the self-contained game
        run: dotnet publish src/NeonCue -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: Upload the unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: NeonCue-unsigned
          path: out/NeonCue.exe
          if-no-files-found: error

      - name: Sign with SignPath (waits for manual approval)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: neon-cue
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Zip the download
        shell: pwsh
        run: |
          $exe = if (Test-Path signed/NeonCue.exe) { 'signed/NeonCue.exe' } else { 'out/NeonCue.exe' }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          Compress-Archive -Path $exe -DestinationPath NeonCue-win-x64.zip -Force

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonCue-win-x64
          path: NeonCue-win-x64.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} NeonCue-win-x64.zip --title "Neon Cue ${{ github.ref_name }}" --generate-notes
          } else {
            gh release upload ${{ github.ref_name }} NeonCue-win-x64.zip --clobber
          }
