name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build NeonCue.sln -c Release
      - name: Physics validation (real billiards laws)
        run: dotnet run --project tests/NeonCue.PhysicsCheck -c Release --no-build
      - name: AI / physics simulation
        run: dotnet run --project tests/NeonCue.Sim -c Release --no-build -- 1 all all
      - name: Snooker frame, shot by shot (Pro vs Pro)
        env:
          SIM_VERBOSE: "1"
        run: dotnet run --project tests/NeonCue.Sim -c Release --no-build -- 1 Pro Snooker
      - name: Audio mixer check (no dropped or clipped sounds)
        run: dotnet run --project tests/NeonCue.AudioCheck -c Release --no-build -- audiocheck.wav
      - name: Automated play-test (mouse input -> shot accuracy)
        shell: pwsh
        run: |
          $p = Start-Process src/NeonCue/bin/Release/net8.0-windows/NeonCue.exe -ArgumentList '--playtest','playtest.txt','40' -Wait -PassThru
          Get-Content playtest.txt
          exit $p.ExitCode
      - name: Frame benchmark (smoothness)
        shell: pwsh
        run: |
          Start-Process src/NeonCue/bin/Release/net8.0-windows/NeonCue.exe -ArgumentList '--bench','bench.txt' -Wait
          Get-Content bench.txt
      - name: Screenshots
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($m in 'snooker','watchsnooker','game','menu','shop') {
            Start-Process src/NeonCue/bin/Release/net8.0-windows/NeonCue.exe -ArgumentList '--render',"shots/$m.png",$m -Wait
          }
          $env:NEONCUE_STATS = '1'
          Start-Process src/NeonCue/bin/Release/net8.0-windows/NeonCue.exe -ArgumentList '--render','shots/scoreboard.png','watchsnooker' -Wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
